name: Reusable testing workflow

on:
  workflow_call:
    inputs:
      base_ref:
        required: true
        type: string
      folder:
        required: true
        type: string
      head_ref:
        required: false
        type: string
      include:
        required: true
        type: string
      repository:
        required: true
        type: string

jobs:
  main:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(inputs.folder) }}
        os: [ubuntu-latest, windows-latest]
        release: [R2024b]
        include: ${{ fromJSON(inputs.include) }}
    name: "${{ matrix.folder }} - ${{ matrix.os }} - ${{ matrix.release }}"
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ inputs.head_ref }}
          repository: ${{ inputs.repository }}
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: Check out WEC-Sim
        uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: ${{ inputs.base_ref }}
          path: './WEC-Sim'
      - name: Check out MoorDyn
        if: matrix.folder == 'Mooring' || matrix.folder == 'OWC' || matrix.folder == 'Paraview_Visualization'
        uses: actions/checkout@v7
        with:
          repository: WEC-Sim/MoorDyn
          path: './MoorDyn'
      - name: Copy MoorDyn Files
        if: matrix.folder == 'Mooring' || matrix.folder == 'OWC' || matrix.folder == 'Paraview_Visualization'
        run: |
            cp -r * ../WEC-Sim/source/functions/moorDyn
            ls ../WEC-Sim/source/functions/moorDyn
        shell: bash
        working-directory: './MoorDyn'
      - name: Install MinGW for MATLAB accelerator
        if: (matrix.folder == 'Mooring' || matrix.folder == 'Paraview_Visualization') && matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v3
        with:
          version: 8.1.0
          platform: x64
      - name: Expose MinGW to MATLAB
        if: (matrix.folder == 'Mooring' || matrix.folder == 'Paraview_Visualization') && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $gcc = (where.exe gcc.exe | Select-String "mingw64\\bin\\gcc.exe" | Select-Object -First 1).ToString()
          $mingwBin = Split-Path $gcc -Parent
          $mingwRoot = Split-Path $mingwBin -Parent

          Write-Host "gcc: $gcc"
          Write-Host "MW_MINGW64_LOC: $mingwRoot"

          "MW_MINGW64_LOC=$mingwRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          gcc --version
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: ${{ matrix.products }}
          release: ${{ matrix.release }}
      - name: Check MATLAB compiler
        uses: matlab-actions/run-command@v3
        with:
          command: |
            getenv('MW_MINGW64_LOC')
            mex -setup C
            mex -setup C++
            mex.getCompilerConfigurations('C','Installed')
            mex.getCompilerConfigurations('C++','Installed')
      - name: Start display server (Desalination on Linux)
        if: matrix.folder == 'Desalination' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Install WEC-Sim, run tests and generate artifacts
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath('WEC-Sim/source'));
            results = wecSimAppTest("${{ matrix.folder }}"),
            assertSuccess(results);
